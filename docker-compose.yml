# The Brilliant home server: the API plus its PostgreSQL database. See docs/server.md.
#   cp .env.example .env   (then set POSTGRES_PASSWORD)
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brilliant
      POSTGRES_USER: brilliant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brilliant -d brilliant"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: src/Brilliant.Server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=brilliant;Username=brilliant;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:
