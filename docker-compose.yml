# The Brilliant home server: the API plus its PostgreSQL database. See docs/server.md.
#   cp .env.example .env   (then set POSTGRES_PASSWORD)
#   scripts/local-ca.sh    (the HTTPS certificate; docs/https.md)
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brilliant
      POSTGRES_USER: brilliant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brilliant -d brilliant"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: src/Brilliant.Server/Dockerfile
    restart: unless-stopped
    # The TLS key is readable by its owner alone (scripts/local-ca.sh), so the server runs as that user; the script sets these in .env.
    user: "${SERVER_UID:-1000}:${SERVER_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=brilliant;Username=brilliant;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      # HTTPS only, with the certificate scripts/local-ca.sh made (docs/https.md). The server refuses to start without it.
      Tls__CertificatePath: /tls/server.pem
      Tls__KeyPath: /tls/server.key
    volumes:
      - ${TLS_DIR:-./tls}:/tls:ro
    ports:
      - "${SERVER_PORT:-8443}:8443"

  # Nightly pg_dump into BACKUP_DIR (default ./backups), keeping the last BACKUP_KEEP. See docs/backup.md.
  backup:
    image: postgres:17-alpine   # same major version as the database, so pg_dump and pg_restore match it
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/backup.sh"]
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    environment:
      PGHOST: postgres
      PGDATABASE: brilliant
      PGUSER: brilliant
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      - ./scripts/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:   # unhealthy if there is no dump from the last 36 hours (docker compose ps shows it)
      test: ["CMD-SHELL", "find /backups -name 'brilliant-*.dump' -mmin -2160 | grep -q ."]
      interval: 1h
      timeout: 10s
      start_period: 5m
      retries: 1

volumes:
  pgdata:
