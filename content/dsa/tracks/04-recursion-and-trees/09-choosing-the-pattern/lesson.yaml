id: lesson.choosing-tree-patterns
title: "Choosing the pattern: recursion and trees"
concepts:
  - id: concept.pick-tree-pattern
    title: Reading the clues for tree and recursion patterns
  - id: concept.combine-tree-patterns
    title: Combining tree patterns in one solution
reviewItems:
  - id: review.choose-trees.shallowest
    concept: concept.pick-tree-pattern
    step: step.choose-trees.check-shallowest
    kind: pattern
  - id: review.choose-trees.increasing-paths
    concept: concept.pick-tree-pattern
    step: step.choose-trees.check-increasing-paths
    kind: pattern
  - id: review.choose-trees.duplicates
    concept: concept.pick-tree-pattern
    step: step.choose-trees.check-not-a-tree-pattern
    kind: pattern
  - id: review.choose-trees.kth
    concept: concept.combine-tree-patterns
    step: step.choose-trees.predict-kth
  - id: review.choose-trees.preorder
    concept: concept.combine-tree-patterns
