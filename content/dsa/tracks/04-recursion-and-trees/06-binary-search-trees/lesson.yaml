id: lesson.binary-search-trees
title: Binary search trees
concepts:
  - id: concept.bst-property
    title: Left subtree smaller, right subtree larger, at every node
  - id: concept.bst-height-cost
    title: Search and insert cost the tree's height
  - id: concept.bst-bounds
    title: Validate with bounds carried down the tree
reviewItems:
  - id: review.bst.predict-path
    concept: concept.bst-property
    step: step.bst.predict-path
  - id: review.bst.predict-heights
    concept: concept.bst-height-cost
    step: step.bst.predict-heights
  - id: review.bst.children-only
    concept: concept.bst-bounds
    step: step.bst.check-children-only
  - id: review.bst.which-problem
