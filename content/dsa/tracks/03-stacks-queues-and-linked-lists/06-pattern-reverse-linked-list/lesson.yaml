title: "Pattern: reverse a linked list"
concepts:
  - id: concept.reverse-three-pointers
    title: "Reversing with prev, cur and nxt"
  - id: concept.reverse-part
    title: Reversing part of a list
reviewItems:
  - id: review.reverse-list.lost-rest
    concept: concept.reverse-three-pointers
    step: step.reverse-list.predict-lost-rest
  - id: review.reverse-list.return-prev
    concept: concept.reverse-three-pointers
    step: step.reverse-list.check-return-prev
  - id: review.reverse-list.reattach
    concept: concept.reverse-part
    step: step.reverse-list.predict-reattach
  - id: review.reverse-list.which-problem
