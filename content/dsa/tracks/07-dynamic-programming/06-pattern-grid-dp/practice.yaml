problems:
  - id: step.grid-dp.practice.min-path-sum
    type: write-code
    title: The cheapest path down
    pattern: pattern.dp-grid
    patternCue: "\"Moving only right or down\" to a corner: the best cost at each cell comes from the cell above or the cell to the left."
    prompt: |
      `costs` is a grid of non-negative numbers (at least one row and column). Starting at the top-left cell and moving only
      right or down, you pay the cost of every cell you enter, including the first and the last. Write `cheapest(costs)` that
      returns the smallest total to reach the bottom-right cell.

      For `[[1, 3, 1], [1, 5, 1], [4, 2, 1]]` it's `7` (1 → 3 → 1 → 1 → 1).
    language: python
    entrypoint: cheapest
    starter: |
      def cheapest(costs):
          pass
    solution: |
      def cheapest(costs):
          rows, cols = len(costs), len(costs[0])
          best = [[0] * cols for _ in range(rows)]
          for r in range(rows):
              for c in range(cols):
                  if r == 0 and c == 0:
                      best[r][c] = costs[r][c]
                  elif r == 0:
                      best[r][c] = best[r][c - 1] + costs[r][c]
                  elif c == 0:
                      best[r][c] = best[r - 1][c] + costs[r][c]
                  else:
                      best[r][c] = min(best[r - 1][c], best[r][c - 1]) + costs[r][c]
          return best[-1][-1]
    tests:
      - input: "[[1, 3, 1], [1, 5, 1], [4, 2, 1]]"
        expected: "7"
      - input: "[[5]]"
        expected: "5"
      - input: "[[1, 2, 3]]"
        expected: "6"
      - input: "[[1], [2], [3]]"
        expected: "6"
      - input: "[[1, 2], [1, 1]]"
        expected: "3"
    hints:
      - "Every cell is reached from exactly two places: above it or to its left."
      - "`best[r][c]` = the cheapest total to stand on `(r, c)`, which is `costs[r][c]` plus the smaller of its two neighbours' bests."
      - "The first row can only be reached from the left, and the first column only from above."
