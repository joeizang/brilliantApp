id: lesson.pattern-union-find
title: "Pattern: connected components and union-find"
concepts:
  - id: concept.components
    title: A connected component is a group of nodes joined by some path
  - id: concept.union-find-union
    title: Union-find keeps each group as a tree; union links one root under the other
  - id: concept.union-find-compression
    title: Path compression keeps the trees flat, so finds stay fast
  - id: concept.union-find-when
    title: Union-find suits edges that arrive over time, and undirected cycles
