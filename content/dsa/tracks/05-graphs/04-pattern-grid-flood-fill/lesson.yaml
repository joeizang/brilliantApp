  - id: concept.grid-bounds
    title: Check a neighbour is on the grid before indexing it
  - id: concept.grid-flood-fill
    title: A loop over every cell starts a flood at each unseen region, counting them
  - id: concept.grid-bfs-moves
    title: A BFS over cells gives the fewest moves
reviewItems:
  - id: review.grid.predict-wrap
    concept: concept.grid-bounds
    step: step.grid.predict-wrap
  - id: review.grid.bounds
