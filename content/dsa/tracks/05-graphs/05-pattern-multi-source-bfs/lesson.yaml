id: lesson.pattern-multi-source-bfs
title: "Pattern: multi-source BFS"
concepts:
  - id: concept.multi-source-start
    title: Start the queue with every source at distance 0
  - id: concept.multi-source-nearest
    title: Each node's distance is to its nearest source, in one pass
  - id: concept.multi-source-minutes
    title: Spreading by rounds counts the minutes, and leftovers were never reached
reviewItems:
  - id: review.multi-source.predict-line
    concept: concept.multi-source-nearest
    step: step.multi-source.predict-line
  - id: review.multi-source.one-pass
    concept: concept.multi-source-start
    step: step.multi-source.check-one-pass
  - id: review.multi-source.why-nearest
    concept: concept.multi-source-nearest
    step: step.multi-source.check-why-nearest
  - id: review.multi-source.predict-rot
    concept: concept.multi-source-minutes
    step: step.multi-source.predict-rot
  - id: review.multi-source.which-problem
    concept: concept.multi-source-nearest
    step: step.multi-source.check-which-problem
    kind: pattern
