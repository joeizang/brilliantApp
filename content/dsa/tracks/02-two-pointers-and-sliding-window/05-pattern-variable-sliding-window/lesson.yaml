id: lesson.pattern-variable-sliding-window
title: "Pattern: a window that grows and shrinks"
concepts:
  - id: concept.variable-window
    title: Expand on the right, shrink on the left
  - id: concept.window-rule
    title: The rule decides when to shrink
  - id: concept.window-linear
    title: Why the nested loop is still O(n)
reviewItems:
  - id: review.varwindow.which-pattern
    concept: concept.variable-window
    step: step.varwindow.check-which-pattern
    kind: pattern
  - id: review.varwindow.when-left-moves
    concept: concept.variable-window
    step: step.varwindow.check-when-left-moves
  - id: review.varwindow.predict-unique
    concept: concept.window-rule
    step: step.varwindow.predict-unique
  - id: review.varwindow.predict-shortest
    concept: concept.window-rule
    step: step.varwindow.predict-shortest
  - id: review.varwindow.write-ones
    concept: concept.window-rule
