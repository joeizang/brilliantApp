id: lesson.pattern-top-k
title: "Pattern: top-K with a heap"
concepts:
  - id: concept.top-k-size-k-heap
    title: "Keep a heap of only k items: push each one, pop when there are k + 1, in O(n log k)"
  - id: concept.top-k-which-heap
    title: "The k largest live in a min-heap, the k smallest in a max-heap: the root is the one to evict"
  - id: concept.top-k-tools
    title: "heapq.nlargest, nsmallest and Counter.most_common, and when sorting is just as good"
reviewItems:
  - id: review.top-k.predict-stream
    concept: concept.top-k-size-k-heap
    step: step.top-k.predict-stream
  - id: review.top-k.which-heap
    concept: concept.top-k-which-heap
    step: step.top-k.check-which-heap
  - id: review.top-k.cost
    concept: concept.top-k-size-k-heap
    step: step.top-k.check-cost
  - id: review.top-k.predict-key
    concept: concept.top-k-tools
    step: step.top-k.predict-key
  - id: review.top-k.which-problem
    concept: concept.top-k-size-k-heap
    step: step.top-k.check-which-problem
    kind: pattern
  - id: review.top-k.cue
    concept: concept.top-k-which-heap
    step: step.top-k.check-cue
