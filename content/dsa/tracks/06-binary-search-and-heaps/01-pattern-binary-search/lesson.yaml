        `mid` is `3`, holding `7`. `4 <= 7`, so the left half `4, 5, 6, 7` is sorted, and `0` isn't in it: `lo = 4`. Now `mid`
        is `5`, holding `1`. `nums[4]` is `0`, `0 <= 1`, so the left half `0, 1` is sorted and holds `0`: `hi = 4`. At `mid = 4`
        is `0`.
