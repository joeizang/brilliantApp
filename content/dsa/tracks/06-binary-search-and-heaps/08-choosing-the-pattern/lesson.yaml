id: lesson.choosing-search-heap-patterns
title: "Choosing the pattern: binary search and heaps"
concepts:
  - id: concept.pick-search-heap-pattern
    title: Reading the clues for binary search and heap patterns
  - id: concept.combine-search-heap-patterns
    title: Combining sorting with a heap in one solution
reviewItems:
  - id: review.choose-search-heap.first-bad
    concept: concept.pick-search-heap-pattern
    step: step.choose-search-heap.check-first-bad
    kind: pattern
  - id: review.choose-search-heap.logs
