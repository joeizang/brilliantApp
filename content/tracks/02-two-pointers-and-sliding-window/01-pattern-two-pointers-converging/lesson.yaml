id: lesson.pattern-two-pointers-converging
title: "Pattern: two pointers from both ends"
concepts:
  - id: concept.two-pointers-converging
    title: Two pointers moving toward each other
  - id: concept.discarding-safely
    title: Why moving a pointer is safe on sorted input
  - id: concept.pointers-meet
    title: They meet after at most n - 1 moves
reviewItems:
  - id: review.converging.which-problem
    concept: concept.two-pointers-converging
    step: step.converging.check-which-problem
    kind: pattern
  - id: review.converging.predict-pair
    concept: concept.two-pointers-converging
    step: step.converging.predict-pair
  - id: review.converging.why-move
    concept: concept.discarding-safely
    step: step.converging.check-why-move
    kind: pattern
  - id: review.converging.unsorted
    concept: concept.discarding-safely
    step: step.converging.check-unsorted
  - id: review.converging.shorter-side
    concept: concept.discarding-safely
    step: step.converging.check-shorter-side
