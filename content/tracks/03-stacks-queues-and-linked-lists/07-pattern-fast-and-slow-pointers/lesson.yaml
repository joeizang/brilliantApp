    solution: |
      class Node:
          def __init__(self, val, next=None):
              self.val = val
              self.next = next


      def build(values):
          head = None
          for v in reversed(values):
              head = Node(v, head)
          return head


      def is_palindrome(head):
          slow = head
          fast = head
          while fast and fast.next:
              slow = slow.next
              fast = fast.next.next
          prev = None
          cur = slow
          while cur:
              nxt = cur.next
              cur.next = prev
              prev = cur
              cur = nxt
          left = head
          right = prev
          while right:
              if left.val != right.val:
                  return False
              left = left.next
              right = right.next
          return True
    tests:
      - input: "build([1, 2, 2, 1])"
        expected: "True"
      - input: "build([1, 2, 3, 2, 1])"
        expected: "True"
      - input: "build([1, 2])"
        expected: "False"
      - input: "build([1, 2, 3, 1])"
        expected: "False"
      - input: "build([5])"
        expected: "True"
      - input: "None"
        expected: "True"
    hints:
      - "Find the middle with `slow` and `fast`."
      - "Reverse the list from `slow` onwards with `prev`, `cur` and `nxt`. `prev` ends on the old last node."
      - "Walk one pointer from `head` and one from `prev`, comparing values, until the reversed half runs out."
    walkthrough:
      call: result = is_palindrome(build([1, 2, 3, 2, 1]))
      visualise:
        - variable: head
          as: linked_list
          pointers: [slow, fast, prev, cur, left, right]
      explanation: |
        `slow` stops on `3`, the middle. Reversing from there turns `3 → 2 → 1` into `1 → 2 → 3`, with `prev` on the old last
        `1`. `2` still links to `3`, so `left` walks `1, 2, 3` from `head` while `right` walks `1, 2, 3` from `prev`. Every
        pair matches, so it's a palindrome.
