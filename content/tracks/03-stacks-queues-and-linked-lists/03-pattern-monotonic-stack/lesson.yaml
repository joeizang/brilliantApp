id: lesson.pattern-monotonic-stack
title: "Pattern: the monotonic stack"
concepts:
  - id: concept.monotonic-stack
    title: A stack of items still waiting for their answer
  - id: concept.monotonic-stack-cost
    title: Each item is pushed once and popped at most once
  - id: concept.monotonic-stack-indices
    title: Store indices, not values
reviewItems:
  - id: review.monotonic.predict-next-greater
    concept: concept.monotonic-stack
    step: step.monotonic.predict-next-greater
  - id: review.monotonic.why-linear
    concept: concept.monotonic-stack-cost
    step: step.monotonic.check-why-linear
  - id: review.monotonic.predict-temperatures
    concept: concept.monotonic-stack-indices
