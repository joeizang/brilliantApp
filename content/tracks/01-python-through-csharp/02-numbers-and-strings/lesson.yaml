id: lesson.numbers-and-strings
title: Numbers and strings
steps:
  - id: step.numbers-and-strings.division
    type: explain
    title: Two kinds of division
    body: |
      In C#, `7 / 2` is `3` because both operands are `int`. Python has two operators:

      - `/` is **true division** and always gives a `float`.
      - `//` is **floor division** and rounds down.
    comparison:
      csharp: |
        int a = 7 / 2;       // 3
        double b = 7 / 2.0;  // 3.5
      python: |
        a = 7 // 2   # 3
        b = 7 / 2    # 3.5
  - id: step.numbers-and-strings.predict-floor
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: print(7 // 2)
    accepted:
      - "3"
    mistakes:
      - answers:
          - "3.5"
        feedback: "`//` is floor division, so the result is a whole number. `/` would give 3.5."
      - answers:
          - "4"
        feedback: "`//` rounds down (floor), never up."
  - id: step.numbers-and-strings.predict-true
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: print(7 / 2)
    accepted:
      - "3.5"
    mistakes:
      - answers:
          - "3"
        feedback: "Unlike C# `int / int`, Python's `/` never truncates; it always returns a float."
