steps:
  - id: step.lists.indexing
    type: explain
    title: Lists and indexing
    body: |
      A Python **list** is C#'s `List<T>`: ordered, zero-based and growable. You write one with square brackets,
      and it can hold any mix of values. `len(nums)` is the count (there is no `.Count` or `.Length`).

      Reading past the end raises an **`IndexError`**, just as C# throws `ArgumentOutOfRangeException`.
    comparison:
      csharp: |
        var nums = new List<int> { 10, 20, 30 };
        int first = nums[0];
        int count = nums.Count;
      python: |
        nums = [10, 20, 30]
        first = nums[0]
        count = len(nums)
  - id: step.lists.check-index-error
    type: choice
    title: Check your understanding
    prompt: |
      `nums = [5, 6, 7]`. What happens when you evaluate `nums[3]`?
    options:
      - text: It raises an IndexError.
        correct: true
        feedback: Right. The valid indexes are 0, 1 and 2, so index 3 is out of range.
      - text: It gives None.
        correct: false
        feedback: Python never quietly fills in a missing item. It raises an error instead.
      - text: It gives 7, wrapping round to the end.
        correct: false
        feedback: Indexes don't wrap. (Negative indexes count from the end, but 3 is positive and out of range.)
      - text: It gives 5, wrapping round to the start.
        correct: false
        feedback: Indexes don't wrap round in either direction.
    hints:
      - How many items are in the list, and what is the last valid index?
      - A list of 3 items has indexes 0, 1 and 2.
  - id: step.lists.negative
    type: explain
    title: Negative indexes
    body: |
      Python lets you count from the **end**: `nums[-1]` is the last item, `nums[-2]` the one before it.
      That replaces C#'s `nums[nums.Count - 1]` (or `nums[^1]`).

      `-1` is the last item because `-0` would just be `0`. A negative index is valid as long as
      its size is no bigger than the length of the list.
    comparison:
      csharp: |
        int last = nums[^1];
        int secondLast = nums[^2];
      python: |
        last = nums[-1]
        second_last = nums[-2]
  - id: step.lists.predict-negative
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: |
      nums = [10, 20, 30, 40]
      print(nums[0], nums[-1], nums[-2])
    accepted:
      - "10 40 30"
    mistakes:
      - answers:
          - "10 30 20"
        feedback: "`-1` is the *last* item (40), not the one before it. `-2` is then 30."
      - answers:
          - "10 40 40"
        feedback: "`-1` and `-2` are different positions. `-2` is the item just before the last."
      - regex: "(?i)error"
        feedback: Negative indexes are legal. They count from the end of the list.
    hints:
      - Negative indexes count backwards from the end.
      - "`nums[-1]` is the last item. Which item is `nums[-2]`?"
      - "The list ends `..., 30, 40`. So `-1` is 40 and `-2` is 30."
  - id: step.lists.slicing
    type: explain
    title: Slicing
    body: |
      A **slice** `nums[start:stop]` copies a run of items. Like `range`, it **includes `start` and excludes `stop`**.
      Leave a side out to mean "from the beginning" or "to the end", and add a third number for a step.

      - `nums[1:3]` is items 1 and 2
      - `nums[:2]` is the first two, and `nums[-2:]` is the last two
      - `nums[::-1]` is the list reversed
      - A slice never raises `IndexError`; it just stops at the end

      In C# you'd reach for `GetRange`, `Skip`/`Take`, or the `nums[1..3]` range syntax on arrays.
    comparison:
      csharp: |
        var middle = nums.Skip(1).Take(2).ToList();
        var lastTwo = nums.TakeLast(2).ToList();
        var backwards = Enumerable.Reverse(nums).ToList();
      python: |
        middle = nums[1:3]
        last_two = nums[-2:]
        backwards = nums[::-1]
  - id: step.lists.predict-slice
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: |
      nums = [10, 20, 30, 40, 50]
      print(nums[1:3])
    options:
      - text: "[20, 30]"
        correct: true
        feedback: Start at index 1 (20), stop before index 3 (40). That is two items.
      - text: "[20, 30, 40]"
        correct: false
        feedback: The stop index is excluded, so item 3 (40) is not part of the slice.
      - text: "[10, 20, 30]"
        correct: false
        feedback: The slice starts at index 1, not index 0.
      - text: "[10, 20]"
        correct: false
        feedback: That would be `nums[:2]`. Here the slice starts at index 1.
    hints:
      - Which index does the slice start at, and which does it stop before?
      - "Items 1 and 2 are included. Item 3 is the first one left out."
  - id: step.lists.predict-slice-ends
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: |
      nums = [10, 20, 30, 40, 50]
      print(nums[-2:], nums[:2])
    accepted:
      - "[40, 50] [10, 20]"
    mistakes:
      - answers:
          - "[30, 40] [10, 20]"
        feedback: "`nums[-2:]` starts two from the end and runs to the end, so it includes the last item."
      - answers:
          - "[40, 50] [10, 20, 30]"
        feedback: "`nums[:2]` stops before index 2, so it keeps only indexes 0 and 1."
      - answers:
          - "[10, 20] [40, 50]"
        feedback: Check the order of the two slices. `print` shows them in the order you wrote them.
    hints:
      - "Read each slice on its own. `nums[-2:]` means \"from two-from-the-end to the end\"."
      - "`nums[:2]` means \"from the start, stopping before index 2\"."
      - "`print` shows both lists on one line, separated by a space."
  - id: step.lists.fill-slices
    type: fill-blank
    title: Complete the slices
    prompt: |
      Fill in the blanks so that `first_three` holds the first three items, `last_two` holds the last two,
      and `backwards` is the whole list reversed.
    template: |
      nums = [1, 2, 3, 4, 5]
      first_three = nums[:{{stop}}]
      last_two = nums[{{start}}:]
      backwards = nums[::{{step}}]
    blanks:
      - id: stop
        accepted:
          - "3"
          - "-2"
        mistakes:
          - answers:
              - "2"
            feedback: The stop index is excluded, so `nums[:2]` keeps only two items.
          - answers:
              - "4"
            feedback: "`nums[:4]` keeps four items. You want three."
      - id: start
        accepted:
          - "-2"
          - "3"
        mistakes:
          - answers:
              - "2"
            feedback: "`nums[2:]` starts at index 2 and keeps three items, not two."
          - answers:
              - "-1"
            feedback: "`nums[-1:]` would keep only the last item."
      - id: step
        accepted:
          - "-1"
        mistakes:
          - answers:
              - "1"
            feedback: A step of 1 walks forwards and keeps the original order.
          - answers:
              - "-2"
            feedback: "A step of -2 walks backwards but skips every other item."
    hints:
      - The first blank is how many items to keep from the front.
      - The second counts from the end. Which negative number is "two from the end"?
      - A negative step walks backwards through the list. Which one visits every item?
  - id: step.lists.mutation
    type: explain
    title: Growing and shrinking a list
    body: |
      Lists are **mutable**. You change them in place:

      - `nums.append(x)` adds to the end (C#'s `Add`)
      - `nums.pop()` removes and **returns** the last item, and `nums.pop(i)` removes index `i` (C#'s `RemoveAt`, but it hands the value back)
      - `nums.insert(i, x)` inserts at `i`

      `append` and `pop` at the end are cheap, so a list makes a good **stack**.

      One thing to watch: `b = a` doesn't copy the list. Both names point at the **same** list, so a change
      through one shows up through the other. Use `a.copy()` or a slice `a[:]` for a real copy.
    comparison:
      csharp: |
        nums.Add(4);
        int last = nums[^1];
        nums.RemoveAt(nums.Count - 1);
      python: |
        nums.append(4)
        last = nums.pop()
  - id: step.lists.predict-append-pop
    type: predict-output
    title: Predict the output
    prompt: What does this print? Put each printed line on its own line.
    code: |
      stack = []
      stack.append(1)
      stack.append(2)
      stack.append(3)
      print(stack.pop())
      print(stack)
    accepted:
      - "3\n[1, 2]"
    mistakes:
      - answers:
          - "1\n[2, 3]"
        feedback: "`pop()` takes from the **end**, not the front. The last item added is the first one out."
      - answers:
          - "3\n[1, 2, 3]"
        feedback: "`pop` also removes the item from the list, so the second `print` shows only what is left."
      - answers:
          - "[1, 2]\n3"
        feedback: The first `print` shows the value `pop()` returned, then the second shows the list that remains.
    hints:
      - Build the list step by step, after each `append`.
      - "`pop()` with no argument removes the last item and returns it."
      - After three appends the list is `[1, 2, 3]`. `pop()` returns 3 and leaves `[1, 2]`.
  - id: step.lists.predict-alias
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: |
      a = [1, 2]
      b = a
      b.append(3)
      print(a)
    options:
      - text: "[1, 2, 3]"
        correct: true
        feedback: "`b = a` doesn't copy. Both names refer to the same list, so appending through `b` changes what `a` sees."
      - text: "[1, 2]"
        correct: false
        feedback: "That would be true if `b` were a copy. `b = a` only gives the same list a second name."
      - text: "[3]"
        correct: false
        feedback: Appending adds to the existing items; it doesn't replace them.
      - text: It raises an error.
        correct: false
        feedback: Nothing here is invalid. Appending to a list through any name that refers to it is fine.
    hints:
      - How many lists exist after `b = a`?
      - "`b = a` copies the *reference*, not the contents."
  - id: step.lists.write-rotate
    type: write-code
    title: Write a function
    prompt: |
      Write `rotate_left(nums)`, which returns the list with its first item moved to the end.
      So `rotate_left([1, 2, 3])` is `[2, 3, 1]`. An empty list stays empty.
    language: python
    entrypoint: rotate_left
    starter: |
      def rotate_left(nums):
          pass
    solution: |
      def rotate_left(nums):
          return nums[1:] + nums[:1]
    tests:
      - input: "[1, 2, 3]"
        expected: "[2, 3, 1]"
      - input: "[5]"
        expected: "[5]"
      - input: "[]"
        expected: "[]"
      - input: "[4, 9, 7, 1]"
        expected: "[9, 7, 1, 4]"
    hints:
      - Think of the list as two pieces, the first item and everything after it. Slices build new lists, so the original is left alone.
      - "`nums[1:]` is everything but the first item. `nums[:1]` is just the first item, as a list."
      - Two lists can be joined with `+`. Put the pieces back in the new order.
      - "`return nums[1:] + nums[:1]`"
  - id: step.lists.comprehensions
    type: explain
    title: Comprehensions vs LINQ
    body: |
      A **list comprehension** builds a new list from another sequence in one expression. It does the job of LINQ's
      `Select` and `Where`, and the order is the reverse of what you may expect:

      `[ expression  for item in source  if condition ]`

      Read it as "give me *expression* for each *item* in *source* where *condition* holds". The `if` part is optional.
      Compare it with the C# you would write.
    comparison:
      csharp: |
        var result = nums
            .Where(n => n % 2 == 0)
            .Select(n => n * n)
            .ToList();
      python: |
        result = [n * n for n in nums if n % 2 == 0]
  - id: step.lists.predict-comprehension
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: print([x * 2 for x in range(5) if x % 2 == 1])
    accepted:
      - "[2, 6]"
    mistakes:
      - answers:
          - "[0, 2, 4, 6, 8]"
        feedback: "The `if x % 2 == 1` part filters first. Only the odd values of x are used."
      - answers:
          - "[1, 3]"
        feedback: The values that pass the filter are doubled before they go into the new list.
      - answers:
          - "[2, 6, 10]"
        feedback: "`range(5)` stops at 4, so the odd values are 1 and 3 only."
    hints:
      - Start with the values `range(5)` produces.
      - Keep only the x where `x % 2 == 1`. Which of 0, 1, 2, 3, 4 pass?
      - "The odd values are 1 and 3. Now double each one."
  - id: step.lists.check-linq
    type: choice
    title: Check your understanding
    prompt: |
      Which comprehension is the same as this LINQ?

      `nums.Where(n => n > 0).Select(n => n * n)`
    options:
      - text: "[n * n for n in nums if n > 0]"
        correct: true
        feedback: Right. The expression comes first, then the loop, then the filter.
      - text: "[n * n if n > 0 for n in nums]"
        correct: false
        feedback: The filter goes after the `for` clause, not before it.
      - text: "[n > 0 for n in nums]"
        correct: false
        feedback: That produces a list of True/False values. It doesn't filter or square anything.
      - text: "[n for n in nums if n * n > 0]"
        correct: false
        feedback: "That keeps the original numbers (not their squares) and filters on the square."
    hints:
      - The `Select` part is the expression at the front. Which option starts with `n * n`?
      - The `Where` part is the condition at the end.
  - id: step.lists.order-evens
    type: parsons
    title: Put the loop in order
    prompt: |
      Arrange these lines into a function `evens(nums)` that returns a new list holding only the even numbers.
      Indentation decides what runs inside the loop and what runs inside the `if`.
    solution: |
      def evens(nums):
          result = []
          for n in nums:
              if n % 2 == 0:
                  result.append(n)
          return result
    hints:
      - Create the empty list first, before the loop.
      - "`return result` runs after the loop is finished, so it lines up with `for`."
      - "Order: `def`, `result = []`, `for`, `if`, `result.append(n)`, `return result`. The `append` is indented under the `if`, which is indented under the `for`."
  - id: step.lists.write-squares-of-evens
    type: write-code
    title: Write a comprehension
    prompt: |
      Write `squares_of_evens(nums)`, which returns a list of the squares of the even numbers in `nums`, in their
      original order. For example `squares_of_evens([1, 2, 3, 4])` is `[4, 16]`.
    language: python
    entrypoint: squares_of_evens
    starter: |
      def squares_of_evens(nums):
          pass
    solution: |
      def squares_of_evens(nums):
          return [n * n for n in nums if n % 2 == 0]
    tests:
      - input: "[1, 2, 3, 4]"
        expected: "[4, 16]"
      - input: "[]"
        expected: "[]"
      - input: "[3, 5]"
        expected: "[]"
      - input: "[-2, 0, 7]"
        expected: "[4, 0]"
    hints:
      - "A filter and a transform, like `Where` and `Select`. Use a comprehension, or a loop with `append`."
      - "The filter is `n % 2 == 0`. The transform is `n * n`."
      - "`[ expression for n in nums if condition ]`"
