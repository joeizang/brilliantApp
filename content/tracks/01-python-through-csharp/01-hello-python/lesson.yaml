id: lesson.hello-python
title: Hello, Python
steps:
  - id: step.hello-python.printing
    type: explain
    title: Printing and variables
    body: |
      You already know how to program, so let's skip the ceremony.
      In Python there is **no `Main`, no `using`, no semicolons** and you don't declare types.

      Indentation, not braces, marks a block.
    snippets:
      - language: python
        code: |
          name = "Ada"
          print(f"Hello, {name}!")
    comparison:
      csharp: |
        string name = "Ada";
        Console.WriteLine($"Hello, {name}!");
      python: |
        name = "Ada"
        print(f"Hello, {name}!")
  - id: step.hello-python.indentation
    type: explain
    title: Indentation is syntax
    body: |
      Where C# uses `{ }`, Python uses **indentation** to group statements.
    comparison:
      csharp: |
        if (x > 0)
        {
            Console.WriteLine("positive");
        }
      python: |
        if x > 0:
            print("positive")
  - id: step.hello-python.check-types
    type: choice
    title: Check your understanding
    prompt: Which of these are true about Python compared to C#?
    multiSelect: true
    options:
      - text: Blocks are marked by indentation.
        correct: true
        feedback: Yes. Indentation is part of the syntax.
      - text: Every statement must end with a semicolon.
        correct: false
        feedback: No semicolons are needed; a newline ends a statement.
      - text: You don't have to declare a variable's type.
        correct: true
        feedback: Right. Types belong to values, not variables.
  - id: step.hello-python.check-main
    type: choice
    title: Entry point
    prompt: Which is the smallest valid Python program that prints Hi?
    options:
      - text: "print('Hi')"
        correct: true
        feedback: Correct. No Main, no class needed.
      - text: "static void Main() { print('Hi') }"
        correct: false
        feedback: That's C#-flavoured. Python has no required entry-point method.
  - id: step.hello-python.predict-fstring
    type: predict-output
    title: Predict the output
    prompt: What does this print? Type it exactly.
    code: |
      name = "Ada"
      print(f"Hi {name}!")
    accepted:
      - "Hi Ada!"
    mistakes:
      - answers:
          - "Hi {name}!"
        feedback: The `f` prefix makes Python substitute `{name}` with its value, just like `$"..."` in C#.
      - regex: "^Hi name!?$"
        feedback: "`name` is a variable, so its value (not its name) is printed."
  - id: step.hello-python.predict-indent
    type: predict-output
    title: Predict the output
    prompt: What does this print?
    code: |
      x = 3
      if x > 5:
          print("big")
      print("done")
    options:
      - text: done
        correct: true
        feedback: Only the indented line belongs to the `if`; `print("done")` always runs.
      - text: big, then done
        correct: false
        feedback: "`x > 5` is false, so the indented block is skipped."
      - text: Nothing
        correct: false
        feedback: The last line is outside the `if` block, so it still runs.
