id: lesson.csharp.locks-and-semaphores
title: Locks, Lock, and SemaphoreSlim
concepts:
  - id: concept.csharp.conc-lock-everyone
    title: A lock protects shared state only if every access takes the same lock
  - id: concept.csharp.conc-lock-lowering
    title: lock compiles to Monitor.Enter and Monitor.Exit in a try/finally, or to EnterScope on a System.Threading.Lock
  - id: concept.csharp.conc-semaphore
    title: SemaphoreSlim admits a limited number of holders and can be awaited
reviewItems:
  - id: review.csharp.conc-lock-everyone
    concept: concept.csharp.conc-lock-everyone
