id: lesson.csharp.concurrent-collections-and-parallel
title: Concurrent collections, Parallel and PLINQ
concepts:
  - id: concept.csharp.conc-collection-ops
    title: Concurrent collections make each single operation safe, not a check followed by an action
  - id: concept.csharp.conc-getoradd
    title: ConcurrentDictionary.GetOrAdd may run its factory more than once but keeps only one value
  - id: concept.csharp.conc-parallel-shared
    title: Parallel and PLINQ bodies run at the same time, so shared mutable state needs synchronization
  - id: concept.csharp.conc-plinq-order
    title: PLINQ gives no ordering guarantee unless you ask for AsOrdered
