id: lesson.csharp.volatile-and-reordering
title: Volatile and reordering
concepts:
  - id: concept.csharp.conc-reordering
    title: The compiler, JIT and CPU may reorder or cache memory operations that another thread then observes
  - id: concept.csharp.conc-volatile-semantics
    title: A volatile read acquires and a volatile write releases, but neither makes a read-modify-write atomic
  - id: concept.csharp.conc-publication
    title: Publish data by writing it first and then writing a volatile flag that readers check before reading it
  - id: concept.csharp.conc-full-fence
    title: lock, Monitor and Interlocked are full barriers, stronger than volatile
reviewItems:
  - id: review.csharp.conc-reordering
    concept: concept.csharp.conc-reordering
    step: step.csharp.volatile.check-hoisting
  - id: review.csharp.conc-volatile-semantics
    concept: concept.csharp.conc-volatile-semantics
    step: step.csharp.volatile.three-threads
  - id: review.csharp.conc-publication
    concept: concept.csharp.conc-publication
