id: lesson.csharp.finding-races
title: Finding races and deadlocks
concepts:
  - id: concept.csharp.conc-race-shape
    title: Races hide in read-modify-write and check-then-act sequences on shared state
  - id: concept.csharp.conc-lock-scope
    title: A lock must cover the whole read-decide-write sequence, not only the write
  - id: concept.csharp.conc-lock-order
    title: Taking two locks in opposite orders can deadlock, and one global order prevents it
  - id: concept.csharp.conc-race-evidence
    title: Passing tests are weak evidence about a race; reason about the interleavings
  - id: concept.csharp.conc-share-nothing
    title: Prefer sharing nothing, then immutable data, then a lock, and lock-free code only last
