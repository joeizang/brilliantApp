    title: foreach is an enumerator and a finally
  - id: concept.csharp.closure-class
    title: A captured variable moves into a generated class
  - id: concept.csharp.primary-capture
    title: A primary constructor parameter that is used becomes a field
  - id: concept.csharp.closure-allocation
    title: A capturing lambda allocates, a non-capturing one is cached
